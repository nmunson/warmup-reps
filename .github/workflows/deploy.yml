name: Deploy to S3 + CloudFront

on:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AWS_REGION: us-east-1
      S3_BUCKET: warmupreps

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build static export
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure S3 website hosting
        run: aws s3 website s3://${S3_BUCKET} --index-document index.html --error-document 404.html

      - name: Sync static assets to S3
        run: aws s3 sync ./out s3://${S3_BUCKET} --delete --exclude "*.html" --cache-control "public, max-age=31536000, immutable"

      - name: Sync HTML to S3
        run: aws s3 sync ./out s3://${S3_BUCKET} --delete --exclude "*" --include "*.html" --cache-control "public, max-age=0, must-revalidate"

      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" --paths "/*"
        env:
          CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
